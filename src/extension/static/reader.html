<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LK Reader</title>
  <link rel="stylesheet" href="reader.css">
</head>
<body>
  <header class="bar">
    <img src="icons/icon-32.png" alt="" width="20" height="20">
    <div class="bar-text">
      <h1 id="book-title">LK Reader</h1>
      <span id="status"></span>
    </div>
    <nav class="pager" aria-label="Pages">
      <button id="prev-page" type="button" title="Previous page (←)" disabled>◀</button>
      <label class="page-field" title="Go to a page">
        <input id="page-input" type="number" min="1" value="1" aria-label="Page number" disabled>
        <span>of <span id="page-count">–</span></span>
      </label>
      <button id="next-page" type="button" title="Next page (→)" disabled>▶</button>
    </nav>
    <button id="open-file" type="button" title="Open another PDF from your computer">Open PDF…</button>
    <button id="toggle-contents" type="button" title="The headings found in this PDF: click one to go to it" disabled>Contents</button>
    <button id="toggle-styles" type="button" title="Correct which text styles are headings" disabled>Headings</button>
    <button id="toggle-layout" type="button" title="Help the reader with the columns and margins of this PDF" disabled>Layout</button>
    <button id="send" type="button" class="primary" title="Send the selected text to LegendKeeper" disabled>Send selection</button>
    <input id="file" type="file" accept="application/pdf,.pdf" hidden>
  </header>
  <main id="main">
    <div id="pages" class="pane" aria-label="Original pages"></div>
    <div id="text" class="pane"><article id="flow"></article></div>
    <aside id="side" class="pane" hidden>
      <section id="contents" aria-label="Contents" hidden></section>
      <section id="styles" aria-label="Text styles" hidden></section>
      <section id="layout" aria-label="Layout" hidden></section>
    </aside>
  </main>
  <div id="drop" class="drop" hidden>
    <div class="drop-box">
      <p id="drop-message"></p>
      <p><strong>Drop a PDF here</strong>, or <button id="choose-file" type="button" class="link">choose one</button>.</p>
    </div>
  </div>
  <script type="module" src="reader.js"></script>
</body>
</html>
