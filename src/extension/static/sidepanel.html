<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LegendKeeper Clipper</title>
  <link rel="stylesheet" href="sidepanel.css">
</head>
<body>
  <header class="bar">
    <img src="icons/icon-32.png" alt="" width="20" height="20">
    <div class="bar-text">
      <h1>LegendKeeper Clipper</h1>
      <span id="index-status"></span>
    </div>
    <button id="refresh" type="button" class="icon" title="Reload the page list from LegendKeeper" aria-label="Reload the page list">⟳</button>
    <button id="open-settings" type="button" class="icon" title="Settings" aria-label="Settings">⚙</button>
  </header>
  <main id="app"></main>
  <script type="module" src="sidepanel.js"></script>
</body>
</html>
